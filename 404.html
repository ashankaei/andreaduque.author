<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found — Andrea Duque</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --paper:#FDFBF5;
  --panel-border:#E3DAC5;
  --ink:#231F1B;
  --muted:#6D6255;
  --rose:#C96B2E;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Inter",system-ui,sans-serif;
  font-size:16.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
a:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:999px;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
.box{max-width:520px;text-align:center;}
.route{width:100%;max-width:340px;height:auto;margin:0 auto 8px;display:block;}
.kicker{font-family:"Fraunces",Georgia,serif;font-style:italic;color:var(--rose);margin:0 0 4px;font-size:1.05rem;}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(2rem,7vw,2.75rem);line-height:1.15;margin:0 0 12px;}
p{margin:0 auto 28px;color:var(--muted);max-width:40ch;}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 26px;border-radius:999px;
  font-size:0.95rem;font-weight:600;text-decoration:none;
  border:1px solid transparent;
  transition:background .2s ease, border-color .2s ease, color .2s ease;
}
.btn-dark{background:var(--ink);color:var(--paper);}
.btn-dark:hover{background:var(--rose);}
.btn-outline{border-color:var(--panel-border);color:var(--ink);}
.btn-outline:hover{border-color:var(--rose);color:var(--rose);}
footer{border-top:1px solid var(--panel-border);padding:28px 20px;text-align:center;color:var(--muted);font-size:0.88rem;}
</style>
</head>
<body>
<main>
  <div class="box">
    <!-- a planned route that wanders off to a "?" — the Detours motif -->
    <svg class="route" viewBox="0 0 340 120" aria-hidden="true">
      <path d="M20 90 L 110 40 L 190 70" fill="none" stroke="#231F1B" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 7" opacity="0.55"/>
      <path d="M190 70 C 230 95, 260 20, 312 46" fill="none" stroke="#C96B2E" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 7"/>
      <circle cx="20" cy="90" r="5" fill="#231F1B"/>
      <circle cx="110" cy="40" r="5" fill="#231F1B"/>
      <circle cx="190" cy="70" r="5" fill="#231F1B"/>
      <text x="312" y="56" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="600" font-size="30" fill="#C96B2E">?</text>
    </svg>
    <p class="kicker">404 · page not found</p>
    <h1>Looks like you took a detour.</h1>
    <p>This page doesn't exist, or it moved somewhere new. The best stories start with a wrong turn, but let's get you back on the road.</p>
    <div class="cta">
      <a class="btn btn-dark" href="/">Back to the homepage</a>
      <a class="btn btn-outline" href="/#join">Join the list</a>
    </div>
  </div>
</main>
<footer>© 2026 Andrea Duque · <a href="mailto:info@andreaduqueauthor.com" style="color:inherit">info@andreaduqueauthor.com</a></footer>
</body>
</html>
